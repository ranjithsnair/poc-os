# Limine bootloader configuration, copied into iso_root/boot/limine/ by
# the top-level Makefile. Comments must be full lines starting with '#'.

# Seconds to wait on the boot menu before auto-booting the default entry.
timeout: 3

# Boot entry: its name is the line starting with '/'.
/PoC-OS
    # Use Limine's own (not Multiboot/Linux) boot protocol, matching the
    # LIMINE_BASE_REVISION request declared in kernel/src/main.c.
    protocol: limine
    # Load the kernel ELF from the boot partition Limine itself booted
    # from ("boot():"), at /boot/kernel — the path the Makefile copies
    # kernel/bin/kernel to inside the ISO.
    path: boot():/boot/kernel
    # The initrd: a ustar archive (built from initrd/* by the top-level
    # Makefile) handed to the kernel as a module — see kernel/src/tarfs.c
    # and the LIMINE_MODULE_REQUEST in kernel/src/main.c. There's no disk
    # driver yet, so this is the only way the kernel can read files.
    module_path: boot():/boot/initrd.tar
